id: market-001
title:
  zh: 去菜市場買水果
  en: Buy fruit at the market
level: A1
scenario:
  zh: 你在菜市場想買水果，先認識三個最有用的詞。
  en: You are at a market buying fruit. Start with three useful words.
goal:
  zh: 能在買水果的情境說出「買、水果、錢」。
  en: Say “buy, fruit, and money” in a market situation.
targetPhrases:
  - id: market-buy
    hanji: 買
    tailo: Bé / bué
    poj: Bé / bóe
    meaning:
      zh: 買、購買
      en: to buy
    cultureNote:
      zh: 買東西時，先說出物件，再補問價錢，是初學者很實用的組合。
      en: Naming the item and then asking its price is a useful beginner pattern.
    sources:
      - https://sutian.moe.edu.tw/zh-hant/su/9037/
    audioUrl: /audio/generated/market-001-buy.mp3
  - id: market-fruit
    hanji: 水果
    tailo: Tsuí-kó
    poj: Chúi-kó
    meaning:
      zh: 水果
      en: fruit
    cultureNote:
      zh: 「水果」在不同地區可能有語音差異；這課先用教育部辭典的主要讀音。
      en: “Fruit” can vary by region; this lesson starts with the main dictionary reading.
    sources:
      - https://sutian.moe.edu.tw/und-hani/su/966/
    audioUrl: /audio/generated/market-001-fruit.mp3
  - id: market-money
    hanji: 錢
    tailo: Tsînn
    poj: Chîⁿ
    meaning:
      zh: 錢、價格中的金錢
      en: money
    cultureNote:
      zh: 問價錢時會搭配數字；下一個課程可以再加入數字練習。
      en: Money pairs naturally with numbers; a later lesson can add number practice.
    sources:
      - https://sutian.moe.edu.tw/zh-hant/su/11988/
    audioUrl: /audio/generated/market-001-money.mp3
