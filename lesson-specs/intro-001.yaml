id: intro-001
number: 3
title:
  zh: 自我介紹
  en: Introduce yourself
level: A1
scenario:
  zh: 第一次見面時，用簡短句子介紹自己。
  en: Introduce yourself with short sentences when meeting someone.
goal:
  zh: 能用自己的名字說「我是……」，完成一個簡短自我介紹。
  en: Say “I am …” with your name and complete a short self-introduction.
targetPhrases:
  - id: intro-i
    hanji: 我
    tailo: Guá
    poj: Goá
    meaning:
      zh: 我
      en: I; me
    cultureNote:
      zh: 「我」是自我介紹最基本的開頭，先熟悉這個代詞再接名字。
      en: “I” is the simplest start to an introduction before adding your name.
    sources:
      - https://sutian.moe.edu.tw/zh-hant/su/3139/
    audioUrl: /audio/generated/intro-001-i.mp3
    audioSha256: 31a7abd3f122ea30dba91d39ff6b8969c19d3aeab4a78639164959a5d6b4e97a
  - id: intro-called
    hanji: 叫
    tailo: Kiò
    poj: Kiò
    meaning:
      zh: 叫做、名叫
      en: to be called; to be named
    cultureNote:
      zh: 說名字時，「我叫……」是簡短又容易開始的句型。
      en: “I am called …” is a short, beginner-friendly way to say your name.
    sources:
      - https://sutian.moe.edu.tw/zh-hant/su/1402/
    audioUrl: /audio/generated/intro-001-name.mp3
    audioSha256: 44ab4121c073f3a0c73366c1fec35952a56843a091cff6d439ccdcda019a709e
  - id: intro-be
    hanji: 是
    tailo: Sī
    poj: Sī
    meaning:
      zh: 是
      en: to be
    cultureNote:
      zh: 「我是學生」這類句子，可以把身分或角色接在「是」後面。
      en: In “I am a student,” a role or identity follows “to be.”
    sources:
